name: Deploy adventureretail.com (Nuxt → Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'nuxt/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-adventureretail-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (nitro cloudflare-pages)
        run: pnpm run build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nuxt
          command: pages deploy dist --project-name=adventureretail-web --branch=main
