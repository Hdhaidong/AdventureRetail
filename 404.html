<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — insightmarketplac</title>
<style>
  :root {
    --bg: #0a0b0e;
    --ink: #f2f4f8;
    --ink-dim: #9aa3b2;
    --accent: #4f8dff;
    --line: rgba(255,255,255,.08);
    --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .box { text-align: center; padding: 48px 24px; }
  .code {
    font-size: clamp(72px, 14vw, 160px);
    font-weight: 800; letter-spacing: -.04em; line-height: 1;
    color: var(--ink);
  }
  .code span { color: var(--accent); }
  h1 { margin-top: 24px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  p { margin-top: 12px; font-size: 15px; color: var(--ink-dim); line-height: 1.8; }
  .links { margin-top: 36px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  a {
    font-size: 14px; text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 12px 28px; color: var(--ink);
    transition: border-color .25s, background .25s;
  }
  a:hover { border-color: var(--accent); background: rgba(79,141,255,.08); }
  a.primary { background: var(--accent); border-color: var(--accent); }
  a.primary:hover { background: #3f7bf0; }
</style>
</head>
<body>
<div class="box">
  <div class="code">4<span>0</span>4</div>
  <h1>这个页面不存在</h1>
  <p>地址可能有误，或页面已被移动。</p>
  <div class="links">
    <a class="primary" href="index.html">返回首页</a>
    <a href="products.html">产品矩阵 · 73 个产品</a>
    <a href="platform.html">数据平台</a>
  </div>
</div>
</body>
</html>
